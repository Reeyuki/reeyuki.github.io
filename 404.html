<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e10" />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://reeyuki.neocities.org/404.html" />
    <title>404 – Reeyuki</title>
    <link rel="stylesheet" href="stylesheet.css" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/static/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/static/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/static/favicon/favicon-16x16.png"
    />
    <link
      rel="mask-icon"
      href="/static/favicon/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta
      name="msapplication-config"
      content="/static/favicon/browserconfig.xml"
    />
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
        gap: 1.5rem;
      }
      .error-code {
        font-family: var(--pixel);
        font-size: 4rem;
        color: var(--accent2);
        letter-spacing: 4px;
      }
      .error-msg {
        font-family: var(--vt);
        font-size: 1.1rem;
        color: var(--text);
        max-width: 400px;
      }
      .construction-wrap {
        border-color: var(--accent2);
      }
    </style>
  </head>
  <body>
    <div class="error-code">404</div>
    <div class="construction-wrap">
      <img
        src="/static/construction.webp"
        alt="Under construction"
        width="600"
        height="375"
      />
    </div>
    <p class="error-msg">
      page not found. it might have moved, been deleted, or never existed.
    </p>
    <a href="/" class="play-btn">← Go home</a>
  </body>
</html>
